<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark carbon container gradient for standalone favicon tabs -->
    <linearGradient id="tachoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141721" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>

    <!-- Cyan Low-Rev Gradient -->
    <linearGradient id="tachoCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>

    <!-- Crimson Redline Gradient -->
    <linearGradient id="tachoRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B72" />
      <stop offset="50%" stop-color="#FF1842" />
      <stop offset="100%" stop-color="#C40026" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="tachoCrimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="tachoCyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base Badge -->
  <rect width="64" height="64" rx="14" fill="url(#tachoBgGrad)" stroke="rgba(255, 24, 66, 0.4)" stroke-width="1.5" />

  <!-- Outer Gauge Track Line -->
  <path
    d="M 14 44 A 22 22 0 1 1 50 44"
    stroke="rgba(255, 255, 255, 0.12)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Segmented LED Rev Arc (Progressing to Redline) -->
  <!-- Cyan Mid-Rev Segment -->
  <path
    d="M 14 44 A 22 22 0 0 1 20 20"
    stroke="url(#tachoCyanGrad)"
    stroke-width="5"
    stroke-linecap="round"
    filter="url(#tachoCyanGlow)"
  />

  <!-- Purple/Magenta Upper Segment -->
  <path
    d="M 23 17 A 22 22 0 0 1 37 13"
    stroke="#B138FF"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Crimson Redline Peak Segment -->
  <path
    d="M 40 14 A 22 22 0 0 1 50 44"
    stroke="url(#tachoRedGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
    filter="url(#tachoCrimsonGlow)"
  />

  <!-- Shift Light Peak Flash Dots -->
  <circle cx="48" cy="22" r="1.8" fill="#FFFFFF" filter="url(#tachoCrimsonGlow)" />
  <circle cx="49" cy="36" r="1.5" fill="#FF1842" />

  <!-- Center Dial Hub -->
  <circle cx="32" cy="35" r="4.5" fill="#141721" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />

  <!-- Sharp Cyan Apex Needle Pointing at Peak Power -->
  <polygon points="30,35 34,35 44,18 42,16" fill="url(#tachoCyanGrad)" filter="url(#tachoCyanGlow)" />
  <circle cx="43" cy="17" r="1.2" fill="#FFFFFF" />

  <!-- Center Hub Pin -->
  <circle cx="32" cy="35" r="2" fill="#00F0FF" />
</svg>