name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

# The archives are built on Linux, the Windows installer from the zip's exe on Windows, and the
# release gets them all with their checksums.
jobs:
  build-release:
    name: Build Release Archives
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build Web UI
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Standalone Multi-Platform Binaries
        env:
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
          BUILD_DATE: ${{ steps.version.outputs.date }}
        run: |
          mkdir -p dist_release
          DIST_DIR="$(pwd)/dist_release"

          LDFLAGS="-s -w -X main.version=${TAG} -X main.commit=${COMMIT} -X main.date=${BUILD_DATE}"

          TARGETS=(
            "windows/amd64/f1telemetry_${TAG}_windows_amd64.zip/f1telemetry.exe"
            "darwin/arm64/f1telemetry_${TAG}_darwin_arm64.zip/f1telemetry"
            "linux/amd64/f1telemetry_${TAG}_linux_amd64.tar.gz/f1telemetry"
          )

          for TARGET in "${TARGETS[@]}"; do
            IFS="/" read -r GOOS GOARCH ARCHIVE_NAME BIN_NAME <<< "$TARGET"
            echo "==> Compiling for ${GOOS}/${GOARCH} -> ${ARCHIVE_NAME}"

            BUILD_TMP="build_${GOOS}_${GOARCH}"
            mkdir -p "${BUILD_TMP}"

            TARGET_LDFLAGS="${LDFLAGS}"
            TARGET_TAGS=""
            if [ "${GOOS}" = "windows" ]; then
              go run ./scripts/build_windows_resources.go
              # GUI app: no console window, the app lives in the notification area
              TARGET_LDFLAGS="${LDFLAGS} -H=windowsgui"
              # Its own window in Wails' release mode (no DevTools)
              TARGET_TAGS="production"
            fi

            CGO_ENABLED=0 GOOS=${GOOS} GOARCH=${GOARCH} go build \
              -trimpath \
              -tags="${TARGET_TAGS}" \
              -ldflags="${TARGET_LDFLAGS}" \
              -o "${BUILD_TMP}/${BIN_NAME}" \
              ./cmd/server

            if [ "${GOOS}" = "windows" ]; then
              go run ./scripts/build_windows_resources.go -clean
            fi

            if [[ "${ARCHIVE_NAME}" == *.zip ]]; then
              (cd "${BUILD_TMP}" && zip -9 "${DIST_DIR}/${ARCHIVE_NAME}" "${BIN_NAME}")
            else
              tar -czf "${DIST_DIR}/${ARCHIVE_NAME}" -C "${BUILD_TMP}" "${BIN_NAME}"
            fi

            rm -rf "${BUILD_TMP}"
          done

      - name: Keep the archives
        uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: dist_release/
          retention-days: 7

  installer:
    name: Windows Installer
    needs: build-release
    # NSIS comes with windows-2022; windows-latest (2025) doesn't have it
    runs-on: windows-2022
    env:
      TAG: ${{ needs.build-release.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get the archives
        uses: actions/download-artifact@v7
        with:
          name: release-archives
          path: dist_release

      # The installer installs the zip's own exe
      - name: Take the exe out of the zip
        shell: pwsh
        run: Expand-Archive "dist_release/f1telemetry_${env:TAG}_windows_amd64.zip" -DestinationPath app

      - name: Build the installer
        uses: ./.github/actions/windows-installer
        with:
          exe: app/f1telemetry.exe
          version: ${{ env.TAG }}
          output: f1telemetry_${{ env.TAG }}_windows_amd64_setup.exe

      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: release-installer
          path: f1telemetry_${{ env.TAG }}_windows_amd64_setup.exe
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build-release, installer]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.build-release.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get the archives and the installer
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist_release
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd dist_release
          sha256sum * > checksums.txt
          cat checksums.txt

      # The notes written for a version (docs/releases/v2.0.0.md, also for its betas) come first,
      # then the list of changes
      - name: Find the release notes
        id: notes
        run: |
          for notes in "docs/releases/${TAG}.md" "docs/releases/${TAG%%-*}.md"; do
            if [ -f "$notes" ]; then
              echo "path=$notes" >> "$GITHUB_OUTPUT"
              break
            fi
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: dist_release/*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(env.TAG, '-') || contains(env.TAG, 'beta') || contains(env.TAG, 'rc') || contains(env.TAG, 'alpha') }}
